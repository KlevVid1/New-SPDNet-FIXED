plugins {
    id 'org.beryx.runtime' version '2.0.1'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

ext.appMainClass = "com.shatteredpixel.shatteredpixeldungeon.desktop.DesktopLauncher"
application.mainClass = appMainClass
processResources {
    from new File(project(':core').projectDir, "/src/main/assets")
    from new File(project(':desktop').projectDir,"/src/main/assets")
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)

tasks.register('debug', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    ignoreExitValue = true

    mainClass = appMainClass
    systemProperty 'Specification-Title', appName
    systemProperty 'Implementation-Title', appPackageName
    // Net的版本号
    systemProperty 'Specification-Version', appVersionName + '}' + appNetVersionName + "-INDEV"
    systemProperty 'Implementation-Version', appVersionCode

    if (osName.contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

tasks.register('release', Jar) {
    //FIXME this is now needed as of gradle 7.0, due to our weird sourceSets setup. Should see if there's a better way to do this
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }

    manifest {
        attributes 'Main-Class': appMainClass
        attributes 'Specification-Title': appName
        attributes 'Implementation-Title': appPackageName
        // Net的版本号
        attributes 'Specification-Version': appVersionName + '}' + appNetVersionName
        attributes 'Implementation-Version': appVersionCode
    }
}

// 添加此build任务, 用于打包debug版本运行多端测试联机
task debugJar(type: Jar) {
    archiveFileName = "${project.name}-debug.jar"
    //FIXME this is now needed as of gradle 7.0, due to our weird sourceSets setup. Should see if there's a better way to do this
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }

    manifest {
        attributes 'Main-Class': appMainClass
        attributes 'Specification-Title': appName
        attributes 'Implementation-Title': appPackageName
        // Net的版本号
        attributes 'Specification-Version': appVersionName + '}' + appNetVersionName + "-INDEV"
        attributes 'Implementation-Version': appVersionCode
    }
}
installDist.dependsOn release
startScripts.dependsOn release
jpackageImage.dependsOn release

runtime {
    modules = ['java.base',
               'java.desktop',
               'java.logging',
               'java.naming',
               'java.xml',
               'java.net.http',
               'java.sql',
               'jdk.unsupported',
               'jdk.crypto.cryptoki',
               'jdk.crypto.ec',
               'jdk.naming.dns',
               'jdk.management']
    options = ['--strip-debug',
               '--compress', '2',
               '--no-header-files',
               '--no-man-pages',
               '--strip-native-commands',
               '--vm', 'server']

    jpackage {
        mainClass = appMainClass
        appVersion = (appVersionName =~ /\d+\.\d+\.\d+/)[0]
        imageName = appName
    }

    if (osName.contains('windows')) {
        //May work on Windows 7 (2009), but that's old enough that I'm only officially supporting Windows 10 (2015)
        targetPlatform("win") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.17_10.zip")
            javaHome = file("./build/jdks/win/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/win/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/windows.ico"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('linux')) {
        //May work on glibc 2.12 (2010), but that's old enough that I'm only officially supporting glibc 2.17 (2012)
        targetPlatform("linux") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_linux_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/linux/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/linux/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/icon_256.png"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('mac')) {
        //This JDK officially supports MacOS 12 (2021), but internals suggest support for 10.12 (2016)
        targetPlatform("mac") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_mac_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/mac/jdk-17.0.17+10/Contents/Home/").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/mac/jdk-17.0.17+10/Contents/Home/")
                imageOptions = ["--icon", file("./src/main/assets/icons/mac.icns"),
                                "--java-options", "-XstartOnFirstThread",
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions",
                                //append .apple because com.shatteredpixel.shatteredpixeldungeon was taken =(
                                "--mac-package-identifier", appPackageName + ".apple"]
            }
        }
    }
}

tasks.register('appImage') {
    group = 'distribution'
    description = 'Creates a standalone x86_64 AppImage for Linux'
    dependsOn 'jpackageImage'

    doLast {
        def buildDirFile = layout.buildDirectory.asFile.get()
        def rootBuildDirFile = rootProject.layout.buildDirectory.asFile.get()
        def jpackageDir = file("${buildDirFile}/jpackage/${appName}")
        if (!jpackageDir.exists()) {
            throw new GradleException("jpackage directory not found at ${jpackageDir}. Run jpackageImage first.")
        }

        def appDir = file("${buildDirFile}/appimage/AppDir")
        delete(appDir)
        appDir.mkdirs()

        // Copy bin and lib
        copy {
            from "${jpackageDir}/bin"
            into "${appDir}/bin"
        }
        copy {
            from "${jpackageDir}/lib"
            into "${appDir}/lib"
        }

        // Make sure launcher binary is executable
        file("${appDir}/bin/${appName}").setExecutable(true, false)

        // Copy icons
        def iconFile = file("src/main/assets/icons/icon_256.png")
        copy {
            from iconFile
            into appDir
            rename { "spdnet.png" }
        }
        copy {
            from iconFile
            into appDir
            rename { ".DirIcon" }
        }

        // Desktop entry
        def desktopFile = file("${appDir}/spdnet.desktop")
        desktopFile.text = """[Desktop Entry]
Name=${appName}
GenericName=Pixel Dungeon
Comment=Multiplayer mod for Shattered Pixel Dungeon
Exec=${appName} %U
Icon=spdnet
Terminal=false
Type=Application
Categories=Game;RolePlaying;
"""

        // AppRun
        def appRunFile = file("${appDir}/AppRun")
        appRunFile.text = """#!/bin/sh
set -e
HERE="\$(dirname "\$(readlink -f "\${0}")")"
exec "\${HERE}/bin/${appName}" "\$@"
"""
        appRunFile.setExecutable(true, false)

        // Tooling: appimagetool
        def toolsDir = file("${rootBuildDirFile}/tools")
        toolsDir.mkdirs()
        def appimagetoolAppDir = file("${toolsDir}/appimagetool.AppDir")
        def appimagetoolExecutable = file("${appimagetoolAppDir}/AppRun")

        if (!appimagetoolExecutable.exists()) {
            println "Downloading appimagetool..."
            def appimageToolFile = file("${toolsDir}/appimagetool-x86_64.AppImage")
            if (!appimageToolFile.exists()) {
                def client = java.net.http.HttpClient.newBuilder()
                        .followRedirects(java.net.http.HttpClient.Redirect.ALWAYS)
                        .build()
                def request = java.net.http.HttpRequest.newBuilder()
                        .uri(URI.create("https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"))
                        .build()
                client.send(request, java.net.http.HttpResponse.BodyHandlers.ofFile(appimageToolFile.toPath()))
                appimageToolFile.setExecutable(true, false)
            }
            // Extract appimagetool to avoid FUSE dependency during build
            def extractPb = new ProcessBuilder(appimageToolFile.absolutePath, '--appimage-extract')
            extractPb.directory(toolsDir)
            extractPb.inheritIO()
            def extractProc = extractPb.start()
            int extractCode = extractProc.waitFor()
            if (extractCode != 0) {
                throw new GradleException("Extracting appimagetool failed with exit code ${extractCode}")
            }
            file("${toolsDir}/squashfs-root").renameTo(appimagetoolAppDir)
            appimagetoolExecutable.setExecutable(true, false)
        }

        def distDir = file("${buildDirFile}/distributions")
        distDir.mkdirs()
        def appImageName = "${appName}-v${appVersionName}-x86_64.AppImage"
        def targetAppImage = file("${distDir}/${appImageName}")
        delete(targetAppImage)

        println "Packaging AppImage with appimagetool..."
        def packPb = new ProcessBuilder(appimagetoolExecutable.absolutePath, appDir.absolutePath, targetAppImage.absolutePath)
        packPb.environment().put('ARCH', 'x86_64')
        packPb.inheritIO()
        def packProc = packPb.start()
        int packCode = packProc.waitFor()
        if (packCode != 0) {
            throw new GradleException("Packaging AppImage failed with exit code ${packCode}")
        }

        // Copy to root directory for easy access
        def rootAppImage = file("${rootDir}/${appImageName}")
        delete(rootAppImage)
        copy {
            from targetAppImage
            into rootDir
        }

        println "AppImage successfully created: ${rootAppImage.absolutePath}"
    }
}


dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"

    //we use LWJGL tinyFD directly to display crash messages
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-windows"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-macos"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-macos-arm64"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-linux"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-linux-arm64"

    // 使用自己的更新
    // implementation project(':services:updates:githubUpdates')
    implementation project(':services:news:shatteredNews')
}